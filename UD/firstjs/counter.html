<!DOCTYPE html>
<html>
    <head>
        <h1> COUNTER </h1>
    </head>
    <body>
        <button id="btn+">INCREASE</button>
        <button id="btn-">DECREASE</button>
        <button id="res">RESET</button>
        <p id="message"></p>
        <p id="message1"></p>
        <script>
let counter=0;

const message=document.getElementById("message");
const message1=document.getElementById("message1");

const inc=document.getElementById("btn+");

inc.addEventListener("click",()=>{
    counter++;
    console.log(`Increase by ${counter}`);
    message.textContent=counter;
    message.style.color="green";
    
}
);

const dec=document.getElementById("btn-");
dec.addEventListener("click",()=>{
    counter--;
    console.log(`Decrease by ${counter}`);
    message.textContent=counter;
    message.style.color="red";
    
}
);

const reset=document.querySelector("#res");
reset.addEventListener("click",()=>{
counter=0;
console.log("Reset to 0");
message.textContent=counter;
message.style.color="grey";
message1.textContent="Reset to 0";
});

        </script>
    </body>
</html>
